openapi: 3.1.0
info:
  title: Garment Studio API
  version: 1.0.0-draft.2
  summary: Projects, assets, garments, rendering, exports, accounts and entitlements.
  description: |
    Contract-first (ADR-0010). Stage 2 draft, revised in Stage 6 to match the implemented API
    (`apps/api`); the API's contract tests validate every response against this file.
    Shared by web, PWA and desktop clients.

    **Conventions**
    - All geometry inside documents is in millimetres (ADR-0008).
    - Errors use RFC 9457 `application/problem+json` with a stable `code`.
    - Cursor pagination: `?cursor=<opaque>&limit=1..100`, response `{ items, nextCursor }`.
    - POSTs that create jobs or consume credits accept `Idempotency-Key`.
    - Rate limits (ADR-0010) are reported with `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`; exceeding them returns 429.
    - Web clients authenticate with a Bearer access token, refreshed via an HttpOnly cookie; desktop clients use PKCE and send the refresh token in the body (ADR-0011).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.garmentstudio.example/v1
    description: Production (placeholder domain)
  - url: https://api.staging.garmentstudio.example/v1
    description: Staging
  - url: http://localhost:4000/v1
    description: Local development
security:
  - bearer: []
tags:
  - name: auth
    description: Registration, sign-in, tokens, password and email flows (ADR-0011)
  - name: me
    description: Profile, settings, sessions, account deletion and data export
  - name: projects
    description: Projects and their append-only version history (ADR-0009)
  - name: assets
    description: Content-addressed uploads with scanning (ADR-0014)
  - name: garments
    description: Public garment catalogue and manifests (ADR-0007)
  - name: renders
    description: Cloud catalogue rendering jobs (ADR-0013)
  - name: exports
    description: Export records and server-side exports
  - name: entitlements
    description: Plan limits and usage (ADR-0012)
  - name: billing
    description: Provider checkout, portal and webhooks (disabled until pricing is decided)
  - name: system
    description: Health and live events

paths:
  # ─────────────────────────── Auth ───────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      summary: Create an account with email and password
      description: Sends a verification email. Rate class `auth` (10/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '201':
          description: Created and signed in
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: Signed in
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account temporarily locked after repeated failures
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/magic-link:
    post:
      tags: [auth]
      operationId: authMagicLinkRequest
      summary: Email a one-time sign-in link
      description: Always returns 202 to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                redirectUri: { type: string, format: uri, description: Must match an allow-listed client URI }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '202': { description: Accepted }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: authMagicLinkVerify
      summary: Exchange a magic-link token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                platform: { $ref: '#/components/schemas/ClientPlatform' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Signed in
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: authOAuthStart
      summary: Begin OAuth (Google / Apple), optionally with PKCE for desktop
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          description: Desktop only. S256 PKCE challenge.
          schema: { type: string, minLength: 43, maxLength: 128 }
        - name: state
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '302': { description: Redirect to the identity provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501':
          description: Provider credentials not configured in this environment (`oauth_not_configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/desktop/token:
    post:
      tags: [auth]
      operationId: authDesktopToken
      summary: Desktop PKCE code exchange
      description: Called by the Tauri app after the `garmentstudio://auth/callback` deep link. Returns the refresh token in the body (stored in the OS keychain).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, deviceName]
              properties:
                code: { type: string }
                codeVerifier: { type: string, minLength: 43, maxLength: 128 }
                deviceName: { type: string, maxLength: 80 }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesktopAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/desktop/code:
    post:
      tags: [auth]
      operationId: authDesktopCode
      summary: Mint a one-time desktop sign-in code (signed-in browser, step 1 of PKCE)
      description: |
        The desktop app opens the web app with its S256 `code_challenge`; once the person is signed in there,
        the page calls this and redirects to the returned `garmentstudio://auth/callback?code=…` deep link.
        The code expires in 2 minutes and works once, only with the matching `codeVerifier`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codeChallenge, redirectUri]
              properties:
                codeChallenge: { type: string, minLength: 43, maxLength: 128 }
                redirectUri: { type: string, pattern: '^garmentstudio://auth/callback' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Code issued
          content:
            application/json:
              schema:
                type: object
                required: [code, redirectUri, expiresIn]
                properties:
                  code: { type: string }
                  redirectUri: { type: string }
                  expiresIn: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/email/resend:
    post:
      tags: [auth]
      operationId: authEmailResend
      summary: Send the verification email again (at most 3 per 15 minutes)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/jwks:
    get:
      tags: [auth]
      operationId: authJwks
      summary: Public signing keys (verify access tokens and entitlement snapshots offline)
      security: []
      responses:
        '200':
          description: JWK set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { type: object } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token and issue a new access token
      description: Web sends the cookie (plus the `X-CSRF-Token` header); desktop sends `refreshToken` in the body. Reusing an already-rotated token revokes the whole session family.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: New tokens
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/DesktopAuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Signed out }

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: authEmailVerify
      summary: Confirm an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: authPasswordForgot
      summary: Request a password reset email
      description: Always 202 (no account enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '202': { description: Accepted }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: authPasswordReset
      summary: Set a new password with a reset token (revokes all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── Me ───────────────────────────
  /me:
    get:
      tags: [me]
      operationId: meGet
      summary: Current user profile
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: meUpdate
      summary: Update profile (display name, email, password)
      description: Changing email or password requires `currentPassword` (or a fresh magic-link session under 10 min old).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                newPassword: { $ref: '#/components/schemas/Password' }
                currentPassword: { type: string }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [me]
      operationId: meDelete
      summary: Delete the account
      description: Revokes all sessions immediately; data and assets are purged after 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, const: DELETE }
                currentPassword: { type: string }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '202': { description: Deletion scheduled }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/settings:
    get:
      tags: [me]
      operationId: meSettingsGet
      summary: User settings (theme, unit, locale, look defaults, hints)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
    put:
      tags: [me]
      operationId: meSettingsPut
      summary: Replace user settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/sessions:
    get:
      tags: [me]
      operationId: meSessionsList
      summary: Active sessions across devices
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }

  /me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: meSessionRevoke
      summary: Revoke a session (sign out a device)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/export:
    post:
      tags: [me]
      operationId: meDataExport
      summary: Request a full data export (projects + assets as a ZIP)
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Export job accepted; an email is sent when ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─────────────────────────── Projects ───────────────────────────
  /projects:
    get:
      tags: [projects]
      operationId: projectsList
      summary: List my projects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: updatedSince
          in: query
          description: Sync pull, returns projects changed after this instant (including deleted, as tombstones)
          schema: { type: string, format: date-time }
        - name: trash
          in: query
          description: List projects in the trash (restorable for 30 days) instead
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [projects]
      operationId: projectsCreate
      summary: Create a project (revision 1)
      description: Entitlement `project.create`. The client may supply its own id (cuid2) so offline-created projects keep their id.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, doc]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string, minLength: 1, maxLength: 120 }
                doc: { $ref: '#/components/schemas/ProjectDoc' }
                conflictOf:
                  description: Sync sets this when the project is the "(conflicted copy)" of another project (ADR-0009)
                  allOf: [{ $ref: '#/components/schemas/Id' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '403': { $ref: '#/components/responses/EmailUnverified' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: projectsGet
      summary: Get a project with its head document
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          headers:
            ETag:
              description: '"r{headRevision}"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '304': { description: Not modified (If-None-Match matched the head revision) }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: projectsRename
      summary: Rename a project (metadata only; no new revision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      operationId: projectsDelete
      summary: Move a project to trash (soft delete, restorable for 30 days)
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/restore:
    post:
      tags: [projects]
      operationId: projectsRestore
      summary: Restore a deleted project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSummary' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/duplicate:
    post:
      tags: [projects]
      operationId: projectsDuplicate
      summary: Duplicate a project (copies the head revision; assets are shared by reference)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '403': { $ref: '#/components/responses/EmailUnverified' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: projectVersionsList
      summary: Version history (metadata, newest first)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VersionMeta' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [projects]
      operationId: projectVersionsPush
      summary: Push a new revision (optimistic concurrency, ADR-0009)
      description: |
        Accepted only when `baseRevision` equals the current head. All referenced assets must already exist
        (otherwise 422 with `code: asset_missing` and the missing ids). On 409 the body carries the head
        version so the client can run its three-way merge. `docSha256` is the SHA-256 of the canonical JSON
        (keys sorted, no whitespace; `canonicalJson` in packages/core) of `doc` exactly as sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushVersionRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Accepted as the new head
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionMeta' }
        '409':
          description: Stale base revision
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [head]
                    properties:
                      head: { $ref: '#/components/schemas/Version' }
        '403': { $ref: '#/components/responses/EmailUnverified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/versions/{revision}:
    get:
      tags: [projects]
      operationId: projectVersionsGet
      summary: Get a specific revision (full document)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/thumbnail:
    put:
      tags: [projects]
      operationId: projectsSetThumbnail
      summary: Attach a thumbnail asset (uploaded via /assets with kind=thumbnail)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { $ref: '#/components/schemas/Id' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Set }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── Assets ───────────────────────────
  /assets/uploads:
    post:
      tags: [assets]
      operationId: assetsCreateUpload
      summary: Start an upload (dedupes by sha256)
      description: |
        Returns the existing asset when the same sha256 and kind already exist for this user (`deduped: true`).
        Otherwise returns presigned multipart part URLs (5–100 MiB parts, expiring in 15 min).
        Allowed types: image/png, image/jpeg, image/webp, image/avif, image/svg+xml, application/pdf (incl. AI with a PDF stream). Max 50 MB.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Deduplicated, asset already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '201':
          description: Upload created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: Same file was previously rejected (`asset_rejected`), or the body is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /assets:
    get:
      tags: [assets]
      operationId: assetsFindBySha
      summary: Find my uploads by content hash (sync fetches a design's images on another device)
      parameters:
        - name: sha256
          in: query
          required: true
          description: One or more (repeat the parameter) lowercase hex SHA-256 values
          schema:
            oneOf:
              - { type: string, pattern: '^[a-f0-9]{64}$' }
              - { type: array, maxItems: 100, items: { type: string, pattern: '^[a-f0-9]{64}$' } }
        - name: kind
          in: query
          schema: { type: string, enum: [artwork, thumbnail], default: artwork }
      responses:
        '200':
          description: Matching assets with a short-lived download URL (only when scanned clean)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Asset'
                        - type: object
                          properties:
                            downloadUrl: { type: [string, 'null'], format: uri }
                            downloadUrlExpiresAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /assets/{assetId}/parts:
    get:
      tags: [assets]
      operationId: assetsListParts
      summary: List already-uploaded parts (resume an interrupted upload)
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [parts]
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      required: [partNumber, etag]
                      properties:
                        partNumber: { type: integer }
                        etag: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /assets/{assetId}/complete:
    post:
      tags: [assets]
      operationId: assetsCompleteUpload
      summary: Complete a multipart upload; the asset enters the scan queue (`scanStatus=pending`)
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1, maximum: 10000 }
                      etag: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assets/{assetId}:
    get:
      tags: [assets]
      operationId: assetsGet
      summary: Asset metadata plus a short-lived download URL (only when `scanStatus=clean`)
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - type: object
                    properties:
                      downloadUrl: { type: [string, 'null'], format: uri }
                      downloadUrlExpiresAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Garments ───────────────────────────
  /garments:
    get:
      tags: [garments]
      operationId: garmentsList
      summary: Garment catalogue (public; cacheable)
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, default: en }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GarmentSummary' }

  /garments/{garmentId}:
    get:
      tags: [garments]
      operationId: garmentsGet
      summary: Garment manifest for the latest (or a given) version
      security: []
      parameters:
        - name: garmentId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
        - name: version
          in: query
          schema: { type: string }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GarmentModel' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Renders ───────────────────────────
  /renders:
    get:
      tags: [renders]
      operationId: rendersList
      summary: My render jobs (newest first)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: projectId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RenderJob' }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [renders]
      operationId: rendersCreate
      summary: Queue a cloud catalogue render
      description: |
        Entitlements `render.cloud`, `render.size`, `render.quality`. Credits are charged only on success (ADR-0013).
        Progress is pushed over the WebSocket (`render.progress`); polling `GET /renders/{id}` also works.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRenderRequest' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /renders/{renderId}:
    get:
      tags: [renders]
      operationId: rendersGet
      summary: Render job status and output
      parameters:
        - $ref: '#/components/parameters/RenderId'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /renders/{renderId}/cancel:
    post:
      tags: [renders]
      operationId: rendersCancel
      summary: Cancel a queued or running render (no credit charged)
      parameters:
        - $ref: '#/components/parameters/RenderId'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '409': { $ref: '#/components/responses/Conflict' }

  /renders/{renderId}/retry:
    post:
      tags: [renders]
      operationId: rendersRetry
      summary: Retry a failed or cancelled render as a new job with the same parameters
      parameters:
        - $ref: '#/components/parameters/RenderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── Exports ───────────────────────────
  /exports:
    post:
      tags: [exports]
      operationId: exportsCreate
      summary: Record a client-side export, or queue a server-side one
      description: |
        Exports normally run on the client (works offline); the client then calls this with `ranOn: client`
        so the entitlement `export.create` is counted (exports done while offline are reported on reconnect).
        `ranOn: server` (a CPU export worker for very large sublimation sets) is not offered yet and answers 501.
        Over the monthly quota, an export credit is used if the user has one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExportRequest' }
      responses:
        '404': { $ref: '#/components/responses/NotFound' }
        '501':
          description: Server-side exports are not available yet (`server_export_unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Recorded (client export)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRecord' }
        '202':
          description: Queued (server export)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRecord' }
        '402': { $ref: '#/components/responses/EntitlementRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exports/{exportId}:
    get:
      tags: [exports]
      operationId: exportsGet
      summary: Export status and output
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRecord' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Entitlements & billing ───────────────────────────
  /entitlements:
    get:
      tags: [entitlements]
      operationId: entitlementsGet
      summary: Current plan, limits and usage, plus a signed snapshot for offline use (24 h TTL)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }

  /billing/plans:
    get:
      tags: [billing]
      operationId: billingPlans
      summary: Public plans (empty until billing is enabled, ADR-0012)
      security: []
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlanPublic' }

  /billing/checkout:
    post:
      tags: [billing]
      operationId: billingCheckout
      summary: Create a provider checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, period]
              properties:
                planId: { type: string }
                period: { type: string, enum: [monthly, yearly] }
      responses:
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '501':
          description: Billing not enabled in this environment
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /billing/portal:
    post:
      tags: [billing]
      operationId: billingPortal
      summary: Customer portal URL (manage, cancel, renew, invoices)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Portal URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '501':
          description: Billing not enabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /billing/webhooks/{provider}:
    post:
      tags: [billing]
      operationId: billingWebhook
      summary: Provider webhook (signature-verified, deduplicated by event id)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paddle, stripe] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '501':
          description: Billing not enabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200': { description: Processed or already processed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/users/{userId}/plan:
    put:
      tags: [entitlements]
      operationId: adminAssignPlan
      summary: Assign a plan manually (admins; ManualProvider until billing is enabled, ADR-0012)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                days: { type: integer, minimum: 1, maximum: 3660, default: 30 }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: The user's entitlements after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── System ───────────────────────────
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness/readiness (DB, Redis, storage)
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  checks:
                    type: object
                    additionalProperties: { type: string, enum: [ok, fail] }
        '503':
          description: Unhealthy (database, Redis or storage failing)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  checks:
                    type: object
                    additionalProperties: { type: string, enum: [ok, fail] }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ws:
    get:
      tags: [system]
      operationId: websocket
      summary: WebSocket upgrade for live events
      description: |
        Send `{ "type": "auth", "token": "<access token>" }` within 5 s of connecting.
        Server events: `render.progress` { jobId, progress, samplesDone }, `render.finished` { jobId, status, outputAssetId },
        `project.updated` { projectId, headRevision, deviceId }, `entitlements.changed` {}.
        Client events: `ping`. See `components.schemas.WsEvent`.
      responses:
        '101':
          description: Switching Protocols. Messages after upgrade follow WsEvent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RefreshCookie:
      description: '`gs_rt` HttpOnly; Secure; SameSite=Lax; Path=/v1/auth (web/PWA only)'
      schema: { type: string }

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RenderId:
      name: renderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 8, maxLength: 128 }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      description: Required when authenticating with the refresh cookie (web/PWA)
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request, invalid/expired token (`token_invalid`, `token_expired`) or cursor (`invalid_cursor`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Not allowed (`csrf_failed`, `origin_not_allowed`, `admin_only`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailUnverified:
      description: The account's email address must be confirmed before saving to the cloud (`email_unverified`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (also returned for resources owned by other users)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Body failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    EntitlementRequired:
      description: The current plan does not allow this action (or quota is used up)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/EntitlementProblem' }
    PayloadTooLarge:
      description: Too large
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: File type not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Id:
      type: string
      pattern: '^[a-z0-9]{20,32}$'
      description: cuid2

    ClientPlatform:
      type: string
      enum: [web, pwa, desktop]

    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: Checked against breached-password lists (k-anonymity)

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine code
          examples: [invalid_credentials, email_taken, stale_revision, asset_missing, not_found, rate_limited, token_expired]
        requestId: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }

    EntitlementProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [action]
          properties:
            action: { type: string }
            limit: { type: [integer, 'null'] }
            used: { type: integer }
            requiredPlan: { type: [string, 'null'] }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        displayName: { type: string, maxLength: 80 }
        platform: { $ref: '#/components/schemas/ClientPlatform' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
        remember: { type: boolean, default: true, description: 'false = session cookie with a 12 h refresh' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        csrfToken: { type: string, description: Web/PWA only }
        user: { $ref: '#/components/schemas/User' }

    DesktopAuthResponse:
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          required: [refreshToken, refreshExpiresAt]
          properties:
            refreshToken: { type: string }
            refreshExpiresAt: { type: string, format: date-time }

    User:
      type: object
      required: [id, email, emailVerified, role, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        displayName: { type: [string, 'null'] }
        role: { type: string, enum: [user, admin] }
        hasPassword: { type: boolean }
        identities:
          type: array
          items: { type: string, enum: [google, apple] }
        createdAt: { type: string, format: date-time }

    UserSettings:
      type: object
      required: [theme, unit, locale]
      properties:
        theme: { type: string, enum: [dark, light, system] }
        unit: { type: string, enum: [mm, cm, in] }
        locale: { type: string, maxLength: 10 }
        lookDefaults:
          type: [object, 'null']
          description: Saved fabric/scene/light defaults (subset of ProjectDoc)
        hints:
          type: [object, 'null']
          additionalProperties: { type: boolean }

    SessionInfo:
      type: object
      required: [id, platform, createdAt, lastUsedAt, current]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }

    ProjectSummary:
      type: object
      required: [id, name, garmentModelId, headRevision, createdAt, updatedAt, deleted]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        garmentModelId: { type: string }
        garmentVersion: { type: string }
        headRevision: { type: integer }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        conflictOf: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [head]
          properties:
            head: { $ref: '#/components/schemas/Version' }

    VersionMeta:
      type: object
      required: [revision, schemaVersion, docSha256, createdAt, platform]
      properties:
        revision: { type: integer }
        baseRevision: { type: [integer, 'null'] }
        schemaVersion: { type: integer }
        docSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    Version:
      allOf:
        - $ref: '#/components/schemas/VersionMeta'
        - type: object
          required: [doc]
          properties:
            doc: { $ref: '#/components/schemas/ProjectDoc' }

    PushVersionRequest:
      type: object
      required: [baseRevision, doc, docSha256, platform]
      properties:
        baseRevision: { type: integer, minimum: 0 }
        doc: { $ref: '#/components/schemas/ProjectDoc' }
        docSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceId: { type: string, maxLength: 64 }

    ProjectDoc:
      type: object
      description: |
        Portable project document. Full schema is defined by zod in packages/core (DATA_MODEL.md §1);
        the API validates it with the same schema. Max serialized size 2 MB (assets are referenced, not inlined).
      required: [schema, schemaVersion, garment, layers, assets]
      properties:
        schema: { type: string, const: garment-studio/project }
        schemaVersion: { type: integer, minimum: 1 }
        garment:
          type: object
          required: [modelId, modelVersion]
          properties:
            modelId: { type: string }
            modelVersion: { type: string }
        units: { type: string, enum: [mm, cm, in] }
        fabric: { type: object }
        light: { type: object }
        scene: { type: object }
        camera: { type: object }
        layers:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Layer' }
        assets:
          type: object
          additionalProperties:
            type: object
            required: [sha256, mime]
            properties:
              sha256: { type: string }
              mime: { type: string }
      additionalProperties: true

    Layer:
      type: object
      required: [id, type, pieceId, side, x, y, w, h, rotationDeg]
      properties:
        id: { type: string }
        type: { type: string, enum: [image, text, shape] }
        name: { type: string }
        visible: { type: boolean }
        pieceId: { type: string }
        side: { type: string, enum: [outside, inside] }
        x: { type: number, description: mm }
        y: { type: number, description: mm }
        w: { type: number, exclusiveMinimum: 0, description: mm }
        h: { type: number, exclusiveMinimum: 0, description: mm }
        rotationDeg: { type: number }
        opacity: { type: number, minimum: 0, maximum: 1 }
      additionalProperties: true

    CreateUploadRequest:
      type: object
      required: [sha256, bytes, mime, kind]
      properties:
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        bytes: { type: integer, minimum: 1, maximum: 52428800 }
        mime:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/avif, image/svg+xml, application/pdf]
        kind: { type: string, enum: [artwork, thumbnail] }
        filename: { type: string, maxLength: 255 }

    UploadTicket:
      type: object
      required: [asset, deduped]
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        deduped: { type: boolean }
        partSize: { type: integer }
        parts:
          type: array
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber: { type: integer }
              url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Asset:
      type: object
      required: [id, kind, sha256, mime, bytes, scanStatus, completed, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [artwork, thumbnail, render, export] }
        sha256: { type: string }
        mime: { type: string }
        bytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        isVector: { type: boolean }
        scanStatus: { type: string, enum: [pending, clean, rejected] }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }

    GarmentSummary:
      type: object
      required: [id, version, category, name, cut, tier, thumbUrl]
      properties:
        id: { type: string }
        version: { type: string }
        category: { type: string }
        name: { type: string }
        cut: { type: string }
        tier: { type: string }
        thumbUrl: { type: string, format: uri }
        isNew: { type: boolean }

    GarmentModel:
      type: object
      description: |
        Garment manifest (DATA_MODEL.md §2; `GarmentModel` in packages/core). Revised in Stage 5/6: UVs are the
        pieces' own frames (ADR-0018), so pieces carry outlines and sheet layout instead of `uvRect`, and seams are
        outline chords. `meshUrl` is null for procedural development garments.
      required: [id, version, category, tier, name, cut, pieces, seams, presets, meshUrl, thumbUrl]
      properties:
        id: { type: string }
        version: { type: string }
        category: { type: string }
        tier: { type: string }
        dev: { type: boolean, description: 'Generated development garment, never in the production catalogue' }
        name: { type: object, additionalProperties: { type: string } }
        cut: { type: object, additionalProperties: { type: string } }
        meshUrl: { type: [string, 'null'], format: uri }
        thumbUrl: { type: string, format: uri }
        maps:
          type: object
          additionalProperties: { type: string, format: uri }
        pieces:
          type: array
          items: { $ref: '#/components/schemas/PieceDef' }
        seams:
          type: array
          items:
            type: object
            required: [a, b]
            properties:
              a: { $ref: '#/components/schemas/SeamChord' }
              b: { $ref: '#/components/schemas/SeamChord' }
        presets:
          type: object
          additionalProperties:
            type: object
            required: [piece, side, fx, fy, fw]
            properties:
              piece: { type: string }
              side: { type: string, enum: [outside, inside] }
              fx: { type: number }
              fy: { type: number }
              fw: { type: number }
        camera: { type: object }

    SeamChord:
      type: object
      description: Vertices `from` to `to` of a piece outline; a.from meets b.from and a.to meets b.to
      required: [piece, from, to]
      properties:
        piece: { type: string }
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0 }

    PieceDef:
      type: object
      required: [id, role, name, outlineMm, cut, sides, layoutMm]
      properties:
        id: { type: string }
        role: { type: string }
        name: { type: object, additionalProperties: { type: string } }
        outlineMm:
          type: array
          description: Closed outline in the piece frame (mm, origin = bbox top-left, y down), clockwise on screen
          items:
            type: array
            prefixItems: [{ type: number }, { type: number }]
            minItems: 2
            maxItems: 2
        cut: { type: integer, minimum: 1 }
        sides:
          type: array
          items: { type: string, enum: [outside, inside] }
        layoutMm:
          type: object
          description: Top-left of the piece on the sewing sheet, per side (mm)
          additionalProperties:
            type: array
            prefixItems: [{ type: number }, { type: number }]
            minItems: 2
            maxItems: 2
        centreLine: { type: boolean }
        marks: { type: array }

    CreateRenderRequest:
      type: object
      required: [projectId, revision, width, height, quality, frame]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        revision: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 256, maximum: 3840 }
        height: { type: integer, minimum: 256, maximum: 3840 }
        quality: { type: string, enum: [draft, good, high, max], description: '150 / 500 / 1000 / 1500 samples' }
        frame: { type: string, enum: [preview, front, back, side] }
        camera:
          type: object
          description: Required when frame = preview
          properties:
            azimuth: { type: number }
            polar: { type: number }
            distance: { type: number }
            target:
              type: array
              items: { type: number }
              minItems: 3
              maxItems: 3
        transparent: { type: boolean, default: false }
        formats:
          type: array
          items: { type: string, enum: [png, webp] }
          default: [png, webp]

    RenderJob:
      type: object
      required: [id, projectId, revision, status, progress, params, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        revision: { type: integer }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: number, minimum: 0, maximum: 1 }
        samplesDone: { type: integer }
        params: { $ref: '#/components/schemas/CreateRenderRequest' }
        queuePosition: { type: [integer, 'null'] }
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
        outputs:
          type: array
          items:
            type: object
            required: [format, assetId]
            properties:
              format: { type: string, enum: [png, webp] }
              assetId: { $ref: '#/components/schemas/Id' }
              url: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobRef:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/JobStatus' }

    CreateExportRequest:
      type: object
      required: [projectId, revision, kind, ranOn]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [snapshot, print_zip, sublimation_zip, spec_pdf, turntable_video] }
        ranOn: { type: string, enum: [client, server] }
        performedAt: { type: string, format: date-time, description: For offline exports reported later }
        params:
          type: object
          properties:
            dpi: { type: integer, enum: [150, 300] }
            bleedMm: { type: number, minimum: 0, maximum: 30 }
            durationSec: { type: integer, minimum: 3, maximum: 20 }
            resolution: { type: string, enum: ['1080x1080', '1080x1920', '1920x1080'] }

    ExportRecord:
      type: object
      required: [id, projectId, revision, kind, ranOn, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        revision: { type: integer }
        kind: { type: string }
        ranOn: { type: string, enum: [client, server] }
        status: { $ref: '#/components/schemas/JobStatus' }
        outputUrl: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }

    Entitlements:
      type: object
      required: [planId, limits, usage, periodEnd, snapshot]
      properties:
        planId: { type: string }
        limits:
          type: object
          additionalProperties: true
          description: null values mean unlimited
        usage:
          type: object
          additionalProperties: { type: integer }
        credits:
          type: object
          properties:
            render: { type: integer }
            export: { type: integer }
        periodEnd: { type: string, format: date-time }
        snapshot:
          type: string
          description: Signed (Ed25519) JWS of limits+usage for offline gating; 24 h TTL

    PlanPublic:
      type: object
      required: [id, name, limits]
      properties:
        id: { type: string }
        name: { type: string }
        limits: { type: object, additionalProperties: true }
        prices:
          type: array
          items:
            type: object
            required: [period, amount, currency]
            properties:
              period: { type: string, enum: [monthly, yearly] }
              amount: { type: number }
              currency: { type: string, minLength: 3, maxLength: 3 }

    WsEvent:
      oneOf:
        - type: object
          required: [type, jobId, progress]
          properties:
            type: { const: render.progress }
            jobId: { type: string }
            progress: { type: number }
            samplesDone: { type: integer }
        - type: object
          required: [type, jobId, status]
          properties:
            type: { const: render.finished }
            jobId: { type: string }
            status: { $ref: '#/components/schemas/JobStatus' }
            outputAssetId: { type: [string, 'null'] }
        - type: object
          required: [type, projectId, headRevision]
          properties:
            type: { const: project.updated }
            projectId: { type: string }
            headRevision: { type: integer }
            deviceId: { type: [string, 'null'] }
        - type: object
          required: [type]
          properties:
            type: { const: entitlements.changed }

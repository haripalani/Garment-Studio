# Fly.io app for the staging API (ADR-0016). Not yet deployed: needs the owner's Fly.io account.
#   fly deploy -c infra/fly/api.staging.toml --dockerfile apps/api/Dockerfile
app = 'garment-studio-api-staging'
primary_region = 'ams'

[build]
  dockerfile = '../../apps/api/Dockerfile'

[deploy]
  # Migrations run before new machines take traffic (expand/contract migrations only).
  release_command = 'node node_modules/prisma/build/index.js migrate deploy'
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '4000'
  TRUST_PROXY = 'true'
  COOKIE_SECURE = 'true'
  COOKIE_DOMAIN = '.staging.garmentstudio.example'
  CORS_ORIGINS = 'https://app.staging.garmentstudio.example'
  APP_URL = 'https://app.staging.garmentstudio.example'
  S3_REGION = 'auto'
  S3_FORCE_PATH_STYLE = 'false'
  ANTIVIRUS = 'clamav'
  CLAMAV_PORT = '3310'
  PASSWORD_BREACH_CHECK = 'true'
  DEFAULT_PLAN = 'free'
  RUN_WORKERS = 'true'
  # Secrets (fly secrets set …): DATABASE_URL, REDIS_URL, JWT_PRIVATE_JWK, IP_HASH_SECRET, S3_ENDPOINT,
  # S3_PUBLIC_ENDPOINT, S3_BUCKET, S3_PUBLIC_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY, PUBLIC_ASSET_BASE,
  # SMTP_URL, MAIL_FROM, CLAMAV_HOST

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/v1/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

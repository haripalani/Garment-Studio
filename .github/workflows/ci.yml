# CI (ADR-0016): checks on every push and pull request. GitHub-hosted runners have no GPU, so the
# path-tracing render tests (API worker, editor GPU E2E) are skipped here and run on a GPU machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.0 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter "!@gs/api" test
      - run: pnpm --filter @gs/editor build
      - run: pnpm --filter @gs/api build
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.34.5 lint architecture/openapi.yaml --config architecture/redocly.yaml

  api:
    name: API integration (Postgres, Redis, S3, SMTP, ClamAV)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SKIP_GPU_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.0 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Local services
        run: docker compose -f infra/dev/compose.yaml up -d --wait
      - name: API configuration
        run: |
          cp apps/api/.env.example apps/api/.env
          pnpm --filter @gs/api --silent keys >> apps/api/.env
          sed -i 's/^JWT_PRIVATE_JWK=$//; s/^IP_HASH_SECRET=$//' apps/api/.env
      - run: pnpm --filter @gs/api db:migrate
        env: { DATABASE_URL: 'postgresql://gs:gs-dev-password@127.0.0.1:55432/gs' }
      - run: pnpm --filter @gs/api test

  e2e:
    name: Editor E2E (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.0 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gs/editor exec playwright install --with-deps chromium
      - name: Local services and API
        run: |
          docker compose -f infra/dev/compose.yaml up -d --wait
          cp apps/api/.env.example apps/api/.env
          pnpm --filter @gs/api --silent keys >> apps/api/.env
          sed -i 's/^JWT_PRIVATE_JWK=$//; s/^IP_HASH_SECRET=$//; s/^COOKIE_SECURE=true/COOKIE_SECURE=false/' apps/api/.env
          echo 'RATE_AUTH_PER_MIN=600' >> apps/api/.env
          pnpm --filter @gs/api db:migrate
          pnpm --filter @gs/api db:seed
      - run: pnpm --filter @gs/editor e2e --project=chromium --project=chromium-exports
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/editor/e2e-report, retention-days: 7 }
